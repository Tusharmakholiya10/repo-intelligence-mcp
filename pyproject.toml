[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind"
version = "0.1.0"
description = "AI-powered codebase intelligence MCP server for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "pydantic-settings"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
repomind = "repomind.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]